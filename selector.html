<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - Seleccionar Modo</title>
  
  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voom">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

  <!-- Adornos gráficos sutiles -->
  <div class="absolute -top-24 -left-24 w-80 h-80 bg-orange-400/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-24 w-80 h-80 bg-amber-400/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- TARJETA PRINCIPAL DEL SELECTOR -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-[0_15px_40px_-15px_rgba(0,0,0,0.08)] border border-slate-200/80 p-8 relative z-10 space-y-6">
    
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-orange-500 via-orange-600 to-amber-500 text-white rounded-2xl shadow-lg shadow-orange-500/25 mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/>
          <path d="M9 17h6"/>
          <circle cx="17" cy="17" r="2"/>
        </svg>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">¿Qué deseas hacer hoy?</h1>
      <p id="user-greeting" class="text-xs font-bold text-orange-600 mt-1 uppercase tracking-wider">Cargando perfil...</p>
    </div>

    <!-- OPCIONES DE SELECCIÓN -->
    <div class="space-y-3">
      <!-- Botón Pasajero -->
      <button onclick="seleccionarModo('pasajero')" class="w-full flex items-center p-4 bg-slate-50 border-2 border-slate-200/80 hover:border-orange-500 hover:bg-orange-50/30 rounded-2xl transition-all group text-left shadow-sm">
        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center font-black text-xl mr-4 group-hover:scale-110 transition-transform">
          👤
        </div>
        <div>
          <h3 class="text-sm font-black text-slate-800">Quiero Viajar</h3>
          <p class="text-[11px] text-slate-500 font-medium">Solicita un vehículo hacia tu destino en segundos</p>
        </div>
      </button>

      <!-- Botón Conductor -->
      <button onclick="seleccionarModo('conductor')" class="w-full flex items-center p-4 bg-slate-50 border-2 border-slate-200/80 hover:border-orange-500 hover:bg-orange-50/30 rounded-2xl transition-all group text-left shadow-sm">
        <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center font-black text-xl mr-4 group-hover:scale-110 transition-transform">
          🚗
        </div>
        <div>
          <h3 class="text-sm font-black text-slate-800">Quiero Conducir</h3>
          <p class="text-[11px] text-slate-500 font-medium">Conéctate para aceptar carreras y generar ingresos</p>
        </div>
      </button>
    </div>

    <div id="status-message" class="p-3.5 rounded-2xl text-xs text-center hidden font-bold border"></div>

    <button onclick="cerrarSesion()" class="w-full text-xs font-bold text-slate-400 hover:text-red-500 transition-colors pt-2">
      Cerrar Sesión de la Cuenta
    </button>
  </div>

  <script>
    const SUPABASE_URL = 'https://gklquvthucityzgcamao.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-p-YL6bWXAQGTddkmm9_mA_HgKlR_eM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
      const greetingEl = document.getElementById('user-greeting');
      
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error || !session) {
          window.location.href = 'index.html';
          return;
        }

        const user = session.user;
        const nombre = user.user_metadata?.full_name || localStorage.getItem('voom_user_name') || user.email.split('@')[0];
        
        if (greetingEl) {
          greetingEl.textContent = `Hola, ${nombre}`;
        }
      } catch (err) {
        console.error("Error al validar sesión en selector:", err);
        if (greetingEl) greetingEl.textContent = `Hola, Usuario`;
      }
    });

    window.seleccionarModo = async function(modo) {
      if (modo === 'pasajero') {
        window.location.href = 'pasajero.html';
      } else {
        try {
          mostrarMensaje("Verificando credenciales de conductor...", "info");

          // Obtenemos la sesión local de manera instantánea sin bloquear la red
          const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
          if (sessionError || !session || !session.user) {
            window.location.href = 'index.html';
            return;
          }
          const user = session.user;

          // Consulta con control de tiempo límite (Timeout de 4 segundos)
          const consultaPerfil = supabaseClient
            .from('perfiles')
            .select('estado_cuenta')
            .eq('id', user.id)
            .maybeSingle();

          const timeoutSupabase = new Promise((_, reject) => 
            setTimeout(() => reject(new Error('Timeout')), 4000)
          );

          let resultado;
          try {
            resultado = await Promise.race([consultaPerfil, timeoutSupabase]);
          } catch (timeoutErr) {
            // Si la base de datos tarda o no responde, lo enviamos al registro de conductor por seguridad
            window.location.href = 'registro_cond.html';
            return;
          }

          const { data, error } = resultado;

          // Redirección exacta según el estado de la cuenta
          if (error || !data || data.estado_cuenta === 'pendiente' || !data.estado_cuenta) {
            window.location.href = 'registro_cond.html';
          } else if (data.estado_cuenta === 'aprobado') {
            window.location.href = 'conductor.html';
          } else if (data.estado_cuenta === 'suspendido') {
            mostrarMensaje("Tu cuenta de conductor se encuentra suspendida.", "error");
          } else {
            window.location.href = 'registro_cond.html';
          }

        } catch (err) {
          console.error("Error al verificar modo conductor:", err);
          window.location.href = 'registro_cond.html';
        }
      }
    };

    window.cerrarSesion = async function() {
      await supabaseClient.auth.signOut();
      localStorage.clear();
      window.location.href = 'index.html';
    };

    function mostrarMensaje(texto, tipo) {
      const statusMsg = document.getElementById('status-message');
      if (!statusMsg) return;
      statusMsg.textContent = texto;
      statusMsg.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'border-red-200', 'bg-slate-50', 'text-slate-600', 'border-slate-200');
      
      if (tipo === 'error') {
        statusMsg.classList.add('bg-red-50', 'text-red-600', 'border-red-200');
      } else {
        statusMsg.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200');
      }
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
