<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - Seleccionar Modo</title>
  
  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voom">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- SDK de OneSignal para la recepción de notificaciones Push -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "98bfb199-5190-4c51-93b0-2cffb11c79e7",
        safari_web_id: "web.onesignal.auto.181829e1-xxxx-xxxx",
        serviceWorkerPath: "../OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/" },
        notifyButton: {
          enable: true,
        },
      });

      OneSignal.Notifications.addEventListener("click", (event) => {
        const notif = event.notification;
        const titulo = notif.title || "Aviso Importante";
        const mensaje = notif.body || "";
        mostrarLectorPush(titulo, mensaje);
      });
    });
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

  <!-- Adornos gráficos sutiles -->
  <div class="absolute -top-24 -left-24 w-80 h-80 bg-orange-400/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-24 w-80 h-80 bg-amber-400/15 rounded-full blur-3xl pointer-events-none"></div>

  <!-- TARJETA PRINCIPAL DEL SELECTOR -->
  <div class="w-full max-w-md bg-white rounded-3xl shadow-[0_15px_40px_-15px_rgba(0,0,0,0.08)] border border-slate-200/80 p-8 relative z-10 space-y-5">
    
    <div class="text-center">
      <!-- Isotipo Oficial icon-192 -->
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-lg shadow-orange-500/15 border border-slate-100 mb-3 p-2 overflow-hidden">
        <img src="./icons/icon-192.png" alt="Voom Isotipo" class="w-full h-full object-contain" />
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">¿Qué deseas hacer hoy?</h1>
      <p id="user-greeting" class="text-xs font-bold text-orange-600 mt-1 uppercase tracking-wider">Cargando perfil...</p>
    </div>

    <!-- OPCIONES DE SELECCIÓN -->
    <div class="space-y-3">
      <!-- Botón Pasajero con Voomer -->
      <button onclick="seleccionarModo('pasajero')" class="w-full flex items-center p-4 bg-slate-50 border-2 border-slate-200/80 hover:border-orange-500 hover:bg-orange-50/30 rounded-2xl transition-all group text-left shadow-sm">
        <div class="w-14 h-14 bg-gradient-to-br from-emerald-50 to-teal-100 border border-emerald-200/60 rounded-xl flex items-center justify-center mr-4 shrink-0 group-hover:scale-110 transition-transform overflow-hidden p-1">
          <img src="./img/voomer.png" alt="Voomer Pasajero" class="w-full h-full object-contain drop-shadow-xs">
        </div>
        <div>
          <h3 class="text-sm font-black text-slate-800">Quiero Viajar</h3>
          <p class="text-[11px] text-slate-500 font-medium">Solicita un vehículo hacia tu destino en segundos</p>
        </div>
      </button>

      <!-- Botón Conductor con Voomer Conductor en carrito galáctico -->
      <button onclick="seleccionarModo('conductor')" class="w-full flex items-center p-4 bg-slate-50 border-2 border-slate-200/80 hover:border-orange-500 hover:bg-orange-50/30 rounded-2xl transition-all group text-left shadow-sm">
        <div class="w-14 h-14 bg-gradient-to-br from-orange-50 to-amber-100 border border-orange-200/60 rounded-xl flex items-center justify-center mr-4 shrink-0 group-hover:scale-110 transition-transform overflow-hidden p-1">
          <img src="./img/voomer_conductor.png" alt="Voomer Conductor" class="w-full h-full object-contain drop-shadow-xs">
        </div>
        <div>
          <h3 class="text-sm font-black text-slate-800">Quiero Conducir</h3>
          <p class="text-[11px] text-slate-500 font-medium">Conéctate para aceptar carreras y generar ingresos</p>
        </div>
      </button>
    </div>

    <!-- TARJETA DE REFERIDOS Y CUPONES -->
    <div class="p-4 bg-gradient-to-br from-orange-50 to-amber-50 border border-orange-200 rounded-2xl space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-black text-orange-900 uppercase tracking-wider flex items-center gap-1.5">
          <span>🎁</span> Invita y Gana
        </span>
        <span id="badge-cupones" class="text-[10px] bg-orange-500 text-white font-black px-2.5 py-0.5 rounded-full shadow-xs">
          0 Cupones 10% OFF
        </span>
      </div>
      <p class="text-[11px] text-orange-800 font-medium leading-relaxed">
        Comparte tu código o enlace. Cuando tu invitado complete su primer viaje, ganas un <strong>10% de descuento</strong> en tu próximo viaje.
      </p>

      <!-- CAJA PARA MOSTRAR Y COPIAR EL CÓDIGO -->
      <div class="flex items-center gap-2 bg-white p-2 rounded-xl border border-orange-200 shadow-inner">
        <input type="text" id="input-codigo-ref" readonly value="Cargando..." class="w-full bg-transparent text-xs font-black text-slate-800 text-center uppercase tracking-widest focus:outline-none" />
        <button onclick="copiarCodigoRef()" id="btn-copiar-ref" class="px-3 py-1.5 bg-orange-500 hover:bg-orange-600 text-white text-[11px] font-bold rounded-lg transition-colors shadow-xs shrink-0">
          Copiar
        </button>
      </div>

      <button onclick="compartirPorWhatsApp()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition-colors shadow-sm flex items-center justify-center gap-2">
        <span>💬</span> Compartir mi enlace por WhatsApp
      </button>
    </div>

    <!-- BOTÓN MANUAL PARA ACTIVAR NOTIFICACIONES PUSH SI EL NAVEGADOR LAS BLOQUEÓ -->
    <button onclick="activarNotificacionesManual()" class="w-full py-3 bg-slate-900 hover:bg-orange-600 text-white font-bold rounded-2xl text-xs transition-colors shadow-md flex items-center justify-center gap-2">
      <span>🔔</span> Activar Alertas y Notificaciones Push
    </button>

    <div id="status-message" class="p-3.5 rounded-2xl text-xs text-center hidden font-bold border"></div>
  </div>

  <!-- MODAL DE LECTURA PUSH AL HACER CLIC -->
  <div id="modal-lector-push" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-slate-100 text-center animate-in fade-in zoom-in duration-200">
      <div class="w-14 h-14 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center mx-auto text-3xl font-bold">
        📢
      </div>
      <div>
        <h3 id="push-titulo" class="text-lg font-black text-slate-900"></h3>
        <p id="push-mensaje" class="text-xs text-slate-600 mt-3 leading-relaxed bg-slate-50 p-3.5 rounded-2xl border border-slate-200/60 font-medium"></p>
      </div>
      <div class="space-y-2">
        <p id="push-contador" class="text-[11px] font-bold text-orange-600 animate-pulse">Cerrando aviso en 3 segundos...</p>
        <button onclick="cerrarLectorPush()" class="w-full py-3 bg-slate-900 hover:bg-orange-600 text-white font-bold rounded-xl text-xs transition-colors shadow-lg">
          Entendido
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL PARA ANUNCIOS EN TIEMPO REAL (APP ABIERTA) -->
  <div id="modal-anuncio" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-slate-100 text-center animate-in fade-in zoom-in duration-200">
      <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold">
        📢
      </div>
      <div>
        <h3 id="anuncio-titulo" class="text-base font-black text-slate-900"></h3>
        <p id="anuncio-mensaje" class="text-xs text-slate-600 mt-2 leading-relaxed"></p>
      </div>
      <button onclick="cerrarAnuncio()" class="w-full py-3 bg-slate-900 hover:bg-orange-600 text-white font-bold rounded-xl text-xs transition-colors shadow-lg">
        Entendido
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://gklquvthucityzgcamao.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-p-YL6bWXAQGTddkmm9_mA_HgKlR_eM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let temporizadorPush = null;
    let codigoReferidoUsuario = '';
    let cuponesUsuario = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      const greetingEl = document.getElementById('user-greeting');
      
      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error || !session) {
          window.location.href = 'index.html';
          return;
        }

        const user = session.user;
        const nombre = user.user_metadata?.full_name || localStorage.getItem('voom_user_name') || user.email.split('@')[0];
        
        if (greetingEl) {
          greetingEl.textContent = `Hola, ${nombre}`;
        }

        // Consultar datos de referidos y cupones del usuario actual
        const { data: perfil } = await supabaseClient
          .from('perfiles')
          .select('codigo_referido, cupones_10_pct')
          .eq('id', user.id)
          .maybeSingle();

        if (perfil) {
          codigoReferidoUsuario = perfil.codigo_referido || ('VOOM-' + user.id.substring(0, 6).toUpperCase());
          cuponesUsuario = perfil.cupones_10_pct || 0;
          
          const badgeCupones = document.getElementById('badge-cupones');
          if (badgeCupones) {
            badgeCupones.textContent = `${cuponesUsuario} Cupón(es) 10% OFF`;
          }

          const inputCodigo = document.getElementById('input-codigo-ref');
          if (inputCodigo) {
            inputCodigo.value = codigoReferidoUsuario;
          }
        }

        iniciarEscuchaAnuncios();

      } catch (err) {
        console.error("Error al validar sesión en selector:", err);
        if (greetingEl) greetingEl.textContent = `Hola, Usuario`;
      }
    });

    // Función para copiar el código de referido al portapapeles
    window.copiarCodigoRef = function() {
      if (!codigoReferidoUsuario) return;
      navigator.clipboard.writeText(codigoReferidoUsuario).then(() => {
        const btn = document.getElementById('btn-copiar-ref');
        if (btn) {
          btn.textContent = '¡Copiado!';
          btn.classList.replace('bg-orange-500', 'bg-emerald-600');
          setTimeout(() => {
            btn.textContent = 'Copiar';
            btn.classList.replace('bg-emerald-600', 'bg-orange-500');
          }, 2000);
        }
      }).catch(err => {
        console.error("Error al copiar código:", err);
      });
    };

    // Función para compartir el enlace personalizado por WhatsApp
    window.compartirPorWhatsApp = function() {
      if (!codigoReferidoUsuario) {
        alert("Tu código de referido se está cargando. Inténtalo de nuevo en un segundo.");
        return;
      }

      const urlBaseApp = window.location.origin + window.location.pathname.replace('selector.html', 'index.html');
      const enlaceInvitacion = `${urlBaseApp}?ref=${codigoReferidoUsuario}`;
      
      const mensaje = encodeURIComponent(`¡Hola! Únete a Voom Perú, la app de movilidad más rápida y segura. Regístrate con mi código ${codigoReferidoUsuario} o entra aquí: ${enlaceInvitacion}`);
      
      window.open(`https://api.whatsapp.com/send?text=${mensaje}`, '_blank');
    };

    // Función manual para forzar la petición de permisos de OneSignal al hacer clic en el botón
    window.activarNotificacionesManual = async function() {
      if (typeof OneSignal !== 'undefined') {
        try {
          await OneSignal.Notifications.requestPermission();
          alert("¡Solicitud enviada! Si aceptaste, ya podrás recibir alertas y notificaciones push.");
        } catch (e) {
          console.error("Error al solicitar permisos:", e);
          alert("No se pudo desplegar el aviso. Revisa si bloqueaste las notificaciones en la configuración de tu navegador.");
        }
      } else {
        alert("El sistema de notificaciones está cargando. Espera un momento e inténtalo de nuevo.");
      }
    };

    function mostrarLectorPush(titulo, mensaje) {
      const modal = document.getElementById('modal-lector-push');
      const titleEl = document.getElementById('push-titulo');
      const msgEl = document.getElementById('push-mensaje');
      const contadorEl = document.getElementById('push-contador');

      if (modal && titleEl && msgEl) {
        titleEl.textContent = titulo;
        msgEl.textContent = mensaje;
        modal.classList.remove('hidden');

        let segundos = 3;
        contadorEl.textContent = `Cerrando aviso en ${segundos} segundos...`;

        if (temporizadorPush) clearInterval(temporizadorPush);

        temporizadorPush = setInterval(() => {
          segundos--;
          if (segundos > 0) {
            contadorEl.textContent = `Cerrando aviso en ${segundos} segundos...`;
          } else {
            cerrarLectorPush();
          }
        }, 1000);
      }
    }

    window.cerrarLectorPush = function() {
      if (temporizadorPush) clearInterval(temporizadorPush);
      const modal = document.getElementById('modal-lector-push');
      if (modal) modal.classList.add('hidden');
    }

    function iniciarEscuchaAnuncios() {
      supabaseClient
        .channel('public:anuncios')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'anuncios' }, (payload) => {
          const nuevoAnuncio = payload.new;
          console.log("Nuevo anuncio detectado en el selector:", nuevoAnuncio);
          mostrarModalAnuncio(nuevoAnuncio.titulo, nuevoAnuncio.mensaje);
        })
        .subscribe();
    }

    window.mostrarModalAnuncio = function(titulo, mensaje) {
      const modal = document.getElementById('modal-anuncio');
      const titleEl = document.getElementById('anuncio-titulo');
      const msgEl = document.getElementById('anuncio-mensaje');
      
      if (modal && titleEl && msgEl) {
        titleEl.textContent = titulo || 'Aviso importante';
        msgEl.textContent = mensaje || '';
        modal.classList.remove('hidden');
      }
    }

    window.cerrarAnuncio = function() {
      const modal = document.getElementById('modal-anuncio');
      if (modal) {
        modal.classList.add('hidden');
      }
    }

    window.seleccionarModo = async function(modo) {
      if (modo === 'pasajero') {
        window.location.href = 'pasajero.html';
      } else {
        try {
          mostrarMensaje("Verificando credenciales de conductor...", "info");

          const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
          if (sessionError || !session || !session.user) {
            window.location.href = 'index.html';
            return;
          }
          const user = session.user;

          const consultaPerfil = supabaseClient
            .from('perfiles')
            .select('estado_cuenta, vehiculo_placa, dni')
            .eq('id', user.id)
            .maybeSingle();

          const timeoutSupabase = new Promise((_, reject) => 
            setTimeout(() => reject(new Error('Timeout')), 4000)
          );

          let resultado;
          try {
            resultado = await Promise.race([consultaPerfil, timeoutSupabase]);
          } catch (timeoutErr) {
            window.location.href = 'registro_cond.html';
            return;
          }

          const { data, error } = resultado;
          const tieneRegistroCompleto = data && (data.vehiculo_placa || data.dni);

          if (error || !data || !tieneRegistroCompleto) {
            window.location.href = 'registro_cond.html';
          } else if (data.estado_cuenta === 'aprobado') {
            window.location.href = 'conductor.html';
          } else if (data.estado_cuenta === 'suspendido') {
            mostrarMensaje("Tu cuenta de conductor se encuentra suspendida por la administración.", "error");
          } else {
            window.location.href = 'index_status.html';
          }

        } catch (err) {
          console.error("Error al verificar modo conductor:", err);
          window.location.href = 'registro_cond.html';
        }
      }
    };

    function mostrarMensaje(texto, tipo) {
      const statusMsg = document.getElementById('status-message');
      if (!statusMsg) return;
      statusMsg.textContent = texto;
      statusMsg.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'border-red-200', 'bg-slate-50', 'text-slate-600', 'border-slate-200');
      
      if (tipo === 'error') {
        statusMsg.classList.add('bg-red-50', 'text-red-600', 'border-red-200');
      } else {
        statusMsg.classList.add('bg-slate-50', 'text-slate-600', 'border-slate-200');
      }
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
