<!-- Scripts JS independientes -->
  <script src="js/anuncios.js"></script>
  <script src="js/conductor.js"></script>
  
  <script>
    const SUPABASE_URL = "https://gklquvthucityzgcamao.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-p-YL6bWXAQGTddkmm9_mA_HgKlR_eM";
    
    // Declarar como global con el nombre exacto que espera conductor.js
    let supabaseClient = null;

    window.addEventListener('DOMContentLoaded', () => {
      // Inicializar cliente Supabase global
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      if (typeof verificarAnunciosGlobales === 'function') {
        verificarAnunciosGlobales('conductor');
      }

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal) {
        if ('serviceWorker' in navigator) {
          try {
            await navigator.serviceWorker.register('/voom_peru/OneSignalSDKWorker.js', {
              scope: '/voom_peru/'
            });
          } catch (e) {
            console.error("Error al registrar el worker de OneSignal:", e);
          }
        }

        await OneSignal.init({
          appId: "98bfb199-5190-4c51-93b0-2cffb11c79e7",
          serviceWorkerPath: "OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/voom_peru/" },
          notifyButton: { enable: false }
        });

        await OneSignal.User.addTag("rol", "conductores");

        if (!OneSignal.User.PushSubscription.optedIn) {
          OneSignal.Slidedown.promptPush();
        }
      });
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => console.error('SW Error:', err));
      });
    }

    // Protecciones de interfaz
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.ctrlKey && e.key === 'U')
      ) {
        e.preventDefault();
      }
    });
  </script>
