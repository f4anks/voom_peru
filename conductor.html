<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - Panel de Conductor</title>
  
  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voom">

  <!-- Estilos base inline para evitar pantalla blanca si falla Tailwind CDN en móvil -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 16px; }
    .card-base { background: #ffffff; border-radius: 24px; padding: 24px; max-width: 600px; margin: 0 auto; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    .status-box { padding: 16px; border-radius: 16px; background: #fff7ed; border: 1px solid #ffedd5; color: #9a3412; font-size: 13px; font-weight: 700; text-align: center; }
  </style>

  <!-- Capturador de errores temprano para iPhone -->
  <script>
    window.onerror = function(msg, url, line) {
      var panel = document.getElementById('status-panel');
      if (panel) {
        panel.style.background = '#fef2f2';
        panel.style.borderColor = '#fecaca';
        panel.style.color = '#991b1b';
        panel.innerHTML = '<b>Error en teléfono:</b> ' + msg + ' (Línea ' + line + ')';
      }
      return false;
    };
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- CONTENIDO PRINCIPAL DEL CONDUCTOR -->
  <div class="card-base space-y-6">
    
    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Panel de Conductor</h1>
        <p id="conductor-greeting" class="text-xs font-bold text-orange-600 mt-0.5 uppercase tracking-wider">Cargando estado...</p>
      </div>
      <button onclick="window.location.href='selector.html'" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-all">
        Cambiar Modo
      </button>
    </div>

    <!-- Panel de Estatus y Bloqueo Administrativo -->
    <div id="status-panel" class="status-box">
      Verificando estatus de cuenta...
    </div>

    <div class="space-y-4">
      <div class="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl flex items-center justify-between">
        <div>
          <h3 class="text-xs font-black text-slate-800 uppercase">Estado de Conexión</h3>
          <p class="text-[11px] text-slate-500 font-medium">Activa tu disponibilidad para recibir solicitudes de viaje</p>
        </div>
        <div id="toggle-container"></div>
      </div>
    </div>

    <!-- Contenedor del Mapa en Vivo -->
    <div class="space-y-2">
      <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider">Ubicación Actual</h3>
      <div id="map" class="w-full h-48 rounded-2xl z-0 border border-slate-200 shadow-inner"></div>
    </div>

    <!-- Contenedor de Solicitudes de Viaje -->
    <div class="space-y-2">
      <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider">Solicitudes Disponibles</h3>
      <div id="lista-viajes" class="space-y-3"></div>
    </div>

    <div id="status-message" class="p-3.5 rounded-2xl text-xs text-center hidden font-bold border"></div>

    <button onclick="cerrarSesion()" class="w-full text-xs font-bold text-slate-400 hover:text-red-500 transition-colors pt-2">
      Cerrar Sesión de la Cuenta
    </button>
  </div>

  <!-- Scripts JS independientes cargados al final -->
  <script src="js/anuncios.js"></script>
  <script src="js/conductor.js"></script>
  
  <script>
    window.SUPABASE_URL = window.SUPABASE_URL || "https://gklquvthucityzgcamao.supabase.co";
    window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable_-p-YL6bWXAQGTddkmm9_mA_HgKlR_eM";

    window.cerrarSesion = async function() {
      if (window.supabaseClient) {
        await window.supabaseClient.auth.signOut();
      }
      localStorage.clear();
      window.location.href = 'index.html';
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(reg => reg.update())
          .catch(err => console.error('SW Error:', err));
      });
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
