<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - Registro de Conductor</title>
  
  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voom">

  <!-- 1. PRIMERO: Cargar la librería oficial de Supabase antes de cualquier uso -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 2. Tailwind CSS y Fuentes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- CONTENIDO PRINCIPAL DE REGISTRO -->
  <div class="w-full max-w-xl mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8 my-auto space-y-6">
    <div class="border-b border-slate-100 pb-4">
      <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Registro de Conductor</h1>
      <p class="text-xs text-slate-500 font-medium mt-0.5">Sube tus datos y documentos para la revisión del administrador.</p>
    </div>

    <div id="status-registro" class="p-3 rounded-xl bg-orange-50 border border-orange-200 text-xs text-orange-800 font-bold hidden"></div>

    <!-- Formulario -->
    <form id="form-registro" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre Completo</label>
        <input type="text" id="nombre_completo" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tipo de Servicio</label>
        <select id="tipo_servicio" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-orange-500 bg-white">
          <option value="moto">Moto Taxi / Reparto</option>
          <option value="auto">Auto / Taxi</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Placa o Matrícula del Vehículo</label>
        <input type="text" id="vehiculo_placa" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-xs uppercase focus:outline-none focus:border-orange-500">
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black text-xs py-3.5 rounded-xl shadow-md transition-transform active:scale-95">
        Enviar Documentos para Aprobación
      </button>
    </form>
  </div>

  <!-- Scripts al final -->
  <script src="js/registro_cond.js"></script>

  <script>
    // Protecciones básicas de interfaz
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
