<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - Estado de Cuenta</title>
  
  <!-- Supabase y Tailwind CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- CONTENEDOR PRINCIPAL DE ESTATUS -->
  <div class="w-full max-w-md mx-auto bg-white rounded-3xl shadow-[0_15px_40px_-15px_rgba(0,0,0,0.08)] border border-slate-200/80 p-6 sm:p-8 my-auto space-y-6 text-center">
    
    <!-- Icono de Reloj / Pendiente -->
    <div class="inline-flex items-center justify-center w-16 h-16 bg-orange-100 text-orange-600 rounded-2xl shadow-xs animate-pulse mx-auto">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>

    <div>
      <h1 id="titulo-estado" class="text-xl font-black text-slate-900 tracking-tight">Verificando Estatus...</h1>
      <p id="texto-estado" class="text-xs text-slate-600 leading-relaxed font-medium mt-2">
        Comprobando el estado actual de tu cuenta con la administración de Voom.
      </p>
    </div>

    <div class="inline-flex items-center space-x-1.5 text-[10px] bg-orange-100 text-orange-700 font-extrabold px-3 py-1 rounded-full border border-orange-200">
      <span class="w-1.5 h-1.5 bg-orange-500 rounded-full animate-ping"></span>
      <span>Sistema de validación Voom</span>
    </div>

    <div class="pt-2 space-y-3">
      <button onclick="window.location.href='selector.html'" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-3 rounded-xl transition-all shadow-xs">
        Volver al Selector de Modo
      </button>
      <button onclick="cerrarSesion()" class="w-full text-xs font-bold text-slate-400 hover:text-red-500 transition-colors pt-2">
        Cerrar Sesión de la Cuenta
      </button>
    </div>

  </div>

  <!-- Lógica independiente para verificar estatus -->
  <script>
    const SUPABASE_URL = "https://gklquvthucityzgcamao.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-p-YL6bWXAQGTddkmm9_mA_HgKlR_eM";
    let supabaseClient = null;

    window.addEventListener('DOMContentLoaded', async () => {
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        return;
      }

      // Validar sesión activa
      const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
      if (authError || !user) {
        window.location.href = 'index.html';
        return;
      }

      // Consultar perfil
      const { data: perfil, error } = await supabaseClient
        .from('perfiles')
        .select('estado_cuenta, tipo_servicio')
        .eq('id', user.id)
        .maybeSingle();

      if (error || !perfil) {
        document.getElementById('titulo-estado').textContent = "Perfil no encontrado";
        document.getElementById('texto-estado').textContent = "No se encontró un perfil asociado a tu cuenta en la base de datos.";
        return;
      }

      // Si por alguna razón ya fue aprobado, redirigir al panel de conductor directamente
      if (perfil.estado_cuenta === 'aprobado') {
        window.location.href = 'conductor.html';
        return;
      }

      // Mostrar texto según el estado de la cuenta
      const esSuspendido = perfil.estado_cuenta === 'suspendido';
      document.getElementById('titulo-estado').textContent = esSuspendido ? 'Cuenta Suspendida' : 'Esperando Aprobación';
      document.getElementById('texto-estado').textContent = esSuspendido 
        ? 'Tu cuenta se encuentra suspendida temporalmente por la administración.' 
        : 'Tus documentos e información han sido recibidos con éxito. Un administrador de Voom debe revisar y aprobar tu perfil antes de habilitar los viajes.';
    });

    async function cerrarSesion() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      localStorage.clear();
      window.location.href = 'index.html';
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
