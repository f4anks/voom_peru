<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - Solicitar Viaje</title>
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voom">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Ocultar scrollbar pero permitir desplazamiento horizontal fluido en móviles */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="w-full max-w-xl mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-8 my-auto space-y-6">
    <div class="border-b border-slate-100 pb-4 flex justify-between items-start">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Solicita tu Viaje</h1>
        <p class="text-xs text-slate-500 font-medium mt-0.5">Elige tu destino y compara servicios al instante.</p>
      </div>
      <a href="selector.html" class="text-xs font-bold text-slate-400 hover:text-slate-700 bg-slate-100 px-3 py-1.5 rounded-xl transition-colors">
        ✕ Volver
      </a>
    </div>

    <div id="status-solicitud" class="p-3 rounded-xl bg-orange-50 border border-orange-200 text-xs text-orange-800 font-bold hidden"></div>

    <!-- 1. CAMPO DE DESTINO PRIMERO -->
    <div class="space-y-2">
      <label class="block text-xs font-black text-slate-800 uppercase tracking-wider">¿A dónde quieres ir?</label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-orange-500 font-bold">📍</span>
        <input type="text" id="destino_direccion" class="w-full pl-10 pr-4 py-3.5 rounded-2xl border-2 border-slate-200 text-xs font-bold focus:outline-none focus:border-orange-500 bg-slate-50/50" placeholder="Ingresa dirección o lugar de destino">
      </div>
    </div>

    <!-- 2. SELECCIÓN DE SERVICIO EN TARJETAS HORIZONTALES (LADO A LADO) -->
    <div class="space-y-2">
      <div class="flex items-center justify-between px-1">
        <label class="text-xs font-black text-slate-800 uppercase tracking-wider">Elige tu Vehículo</label>
        <span class="text-[10px] font-extrabold text-slate-400">Desliza para ver más ➔</span>
      </div>
      
      <!-- Contenedor con scroll horizontal fluido -->
      <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 pt-1" id="lista-servicios-pasajero">
        
        <!-- Opción Moto -->
        <div onclick="seleccionarServicio('moto')" 
             class="service-card cursor-pointer border-2 border-slate-200/80 hover:border-orange-400 bg-white p-3.5 rounded-2xl flex flex-col justify-between transition-all duration-200 active:scale-95 shadow-xs shrink-0 w-36 relative" 
             data-service="moto">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-2xl">🛵</span>
              <span class="bg-orange-100 text-orange-700 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">Rápido</span>
            </div>
            <h4 class="text-xs font-black text-slate-900">Moto</h4>
            <p class="text-[10px] text-slate-400 font-medium leading-tight mt-0.5">1 pasajero</p>
          </div>
          <div class="mt-4 pt-2 border-t border-slate-100">
            <span class="block text-xs font-black text-slate-900 price-tag" data-base="3.00">S/ 3.00</span>
          </div>
        </div>

        <!-- Opción Económico (POR DEFECTO / SELECCIONADA) -->
        <div onclick="seleccionarServicio('economico')" 
             class="service-card cursor-pointer border-2 border-orange-500 bg-gradient-to-b from-orange-50/90 to-amber-50/40 p-3.5 rounded-2xl flex flex-col justify-between transition-all duration-200 active:scale-95 shadow-sm shrink-0 w-36 relative ring-2 ring-orange-500/20" 
             data-service="economico">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-2xl">🚗</span>
              <span class="bg-emerald-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded uppercase">Top</span>
            </div>
            <h4 class="text-xs font-black text-slate-900">Económico</h4>
            <p class="text-[10px] text-slate-500 font-medium leading-tight mt-0.5">Estándar</p>
          </div>
          <div class="mt-4 pt-2 border-t border-orange-200/60">
            <span class="block text-sm font-black text-orange-600 price-tag" data-base="5.00">S/ 5.00</span>
          </div>
        </div>

        <!-- Opción Confort -->
        <div onclick="seleccionarServicio('confort')" 
             class="service-card cursor-pointer border-2 border-slate-200/80 hover:border-orange-400 bg-white p-3.5 rounded-2xl flex flex-col justify-between transition-all duration-200 active:scale-95 shadow-xs shrink-0 w-36 relative" 
             data-service="confort">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-2xl">🚘</span>
              <span class="bg-slate-100 text-slate-600 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">A/C</span>
            </div>
            <h4 class="text-xs font-black text-slate-900">Confort</h4>
            <p class="text-[10px] text-slate-400 font-medium leading-tight mt-0.5">Mod. Alto</p>
          </div>
          <div class="mt-4 pt-2 border-t border-slate-100">
            <span class="block text-xs font-black text-slate-900 price-tag" data-base="7.50">S/ 7.50</span>
          </div>
        </div>

        <!-- Opción Flete -->
        <div onclick="seleccionarServicio('flete')" 
             class="service-card cursor-pointer border-2 border-slate-200/80 hover:border-orange-400 bg-white p-3.5 rounded-2xl flex flex-col justify-between transition-all duration-200 active:scale-95 shadow-xs shrink-0 w-36 relative" 
             data-service="flete">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-2xl">🛻</span>
              <span class="bg-amber-100 text-amber-700 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">Carga</span>
            </div>
            <h4 class="text-xs font-black text-slate-900">Flete</h4>
            <p class="text-[10px] text-slate-400 font-medium leading-tight mt-0.5">Pickup</p>
          </div>
          <div class="mt-4 pt-2 border-t border-slate-100">
            <span class="block text-xs font-black text-slate-900 price-tag" data-base="15.00">S/ 15.00</span>
          </div>
        </div>

        <!-- Opción Grúa -->
        <div onclick="seleccionarServicio('grua')" 
             class="service-card cursor-pointer border-2 border-slate-200/80 hover:border-orange-400 bg-white p-3.5 rounded-2xl flex flex-col justify-between transition-all duration-200 active:scale-95 shadow-xs shrink-0 w-36 relative" 
             data-service="grua">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-2xl">🏗️</span>
              <span class="bg-red-100 text-red-700 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">Auxilio</span>
            </div>
            <h4 class="text-xs font-black text-slate-900">Grúa</h4>
            <p class="text-[10px] text-slate-400 font-medium leading-tight mt-0.5">Remolque</p>
          </div>
          <div class="mt-4 pt-2 border-t border-slate-100">
            <span class="block text-xs font-black text-slate-900 price-tag" data-base="35.00">S/ 35.00</span>
          </div>
        </div>

      </div>
    </div>

    <!-- BOTÓN DE ACCIÓN -->
    <div class="pt-2">
      <button onclick="solicitarViaje()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black text-xs py-4 rounded-2xl shadow-md transition-transform active:scale-95 uppercase tracking-wider">
        Pedir Viaje Ahora
      </button>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://gklquvthucityzgcamao.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-p-YL6bWXAQGTddkmm9_mA_HgKlR_eM";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let servicioSeleccionado = 'economico';

    function seleccionarServicio(tipo) {
      servicioSeleccionado = tipo;
      
      // Restablecer todas las tarjetas a inactivo
      document.querySelectorAll('.service-card').forEach(card => {
        card.className = "service-card cursor-pointer border-2 border-slate-200/80 hover:border-orange-400 bg-white p-3.5 rounded-2xl flex flex-col justify-between transition-all duration-200 active:scale-95 shadow-xs shrink-0 w-36 relative";
        
        const priceElement = card.querySelector('.price-tag');
        if (priceElement) {
          priceElement.className = "block text-xs font-black text-slate-900 price-tag";
        }
      });

      // Activar la tarjeta seleccionada
      const selectedCard = document.querySelector(`[data-service="${tipo}"]`);
      if (selectedCard) {
        selectedCard.className = "service-card cursor-pointer border-2 border-orange-500 bg-gradient-to-b from-orange-50/90 to-amber-50/40 p-3.5 rounded-2xl flex flex-col justify-between transition-all duration-200 active:scale-95 shadow-sm shrink-0 w-36 relative ring-2 ring-orange-500/20";
        
        const priceElement = selectedCard.querySelector('.price-tag');
        if (priceElement) {
          priceElement.className = "block text-sm font-black text-orange-600 price-tag";
        }
      }
    }

    async function solicitarViaje() {
      const destinoInput = document.getElementById('destino_direccion');
      const destino = destinoInput ? destinoInput.value.trim() : '';

      if (!destino) {
        alert("Por favor ingresa la dirección de destino.");
        if (destinoInput) destinoInput.focus();
        return;
      }

      const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
      if (authError || !user) {
        window.location.href = 'index.html';
        return;
      }

      const selectedCard = document.querySelector(`[data-service="${servicioSeleccionado}"]`);
      const precioBase = selectedCard ? parseFloat(selectedCard.querySelector('.price-tag').getAttribute('data-base')) : 5.00;

      const { error } = await supabaseClient
        .from('viajes')
        .insert({
          pasajero_id: user.id,
          tipo_servicio: servicioSeleccionado,
          destino_direccion: destino,
          precio: precioBase,
          estado: 'buscando'
        });

      if (error) {
        alert("Error al solicitar el viaje: " + error.message);
        return;
      }

      alert("🚀 ¡Viaje solicitado con éxito! Buscando conductor cercano...");
      window.location.href = 'selector.html';
    }

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
