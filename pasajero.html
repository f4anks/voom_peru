<!-- SECCIÓN DE SELECCIÓN DE TIPO DE SERVICIO -->
<div class="space-y-3 mt-4">
  <label class="block text-xs font-black text-slate-700 uppercase tracking-wider">Elige tu Tipo de Servicio</label>
  
  <div class="grid grid-cols-1 gap-2.5" id="lista-servicios-pasajero">
    
    <!-- Opción Moto -->
    <div onclick="seleccionarServicio('moto', 1.0)" class="service-card cursor-pointer border-2 border-slate-200/80 hover:border-orange-500 bg-slate-50 p-3.5 rounded-2xl flex items-center justify-between transition-all" data-service="moto">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center text-lg font-black">🛵</div>
        <div>
          <h4 class="text-xs font-black text-slate-900">Moto</h4>
          <p class="text-[10px] text-slate-500">Rápido y económico (1 pasajero)</p>
        </div>
      </div>
      <span class="text-xs font-black text-orange-600 price-tag" data-base="3.00">S/ 3.00</span>
    </div>

    <!-- Opción Económico -->
    <div onclick="seleccionarServicio('economico', 1.2)" class="service-card cursor-pointer border-2 border-orange-500 bg-orange-50/40 p-3.5 rounded-2xl flex items-center justify-between transition-all" data-service="economico">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-lg font-black">🚗</div>
        <div>
          <h4 class="text-xs font-black text-slate-900">Económico</h4>
          <p class="text-[10px] text-slate-500">Auto estándar (Sin aire acondicionado)</p>
        </div>
      </div>
      <span class="text-xs font-black text-orange-600 price-tag" data-base="5.00">S/ 5.00</span>
    </div>

    <!-- Opción Confort -->
    <div onclick="seleccionarServicio('confort', 1.5)" class="service-card cursor-pointer border-2 border-slate-200/80 hover:border-orange-500 bg-slate-50 p-3.5 rounded-2xl flex items-center justify-between transition-all" data-service="confort">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-lg font-black">🚘</div>
        <div>
          <h4 class="text-xs font-black text-slate-900">Confort</h4>
          <p class="text-[10px] text-slate-500">Auto moderno con aire acondicionado</p>
        </div>
      </div>
      <span class="text-xs font-black text-orange-600 price-tag" data-base="7.50">S/ 7.50</span>
    </div>

    <!-- Opción Fletes -->
    <div onclick="seleccionarServicio('flete', 2.2)" class="service-card cursor-pointer border-2 border-slate-200/80 hover:border-orange-500 bg-slate-50 p-3.5 rounded-2xl flex items-center justify-between transition-all" data-service="flete">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center text-lg font-black">🛻</div>
        <div>
          <h4 class="text-xs font-black text-slate-900">Flete / Carga</h4>
          <p class="text-[10px] text-slate-500">Camioneta Pickup para transporte de objetos</p>
        </div>
      </div>
      <span class="text-xs font-black text-orange-600 price-tag" data-base="15.00">S/ 15.00</span>
    </div>

    <!-- Opción Grúa -->
    <div onclick="seleccionarServicio('grua', 3.5)" class="service-card cursor-pointer border-2 border-slate-200/80 hover:border-orange-500 bg-slate-50 p-3.5 rounded-2xl flex items-center justify-between transition-all" data-service="grua">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-red-100 text-red-600 rounded-xl flex items-center justify-center text-lg font-black">🏗️</div>
        <div>
          <h4 class="text-xs font-black text-slate-900">Grúa</h4>
          <p class="text-[10px] text-slate-500">Remolque y auxilio mecánico vehicular</p>
        </div>
      </div>
      <span class="text-xs font-black text-orange-600 price-tag" data-base="35.00">S/ 35.00</span>
    </div>

  </div>
</div>

<script>
  let servicioSeleccionado = 'economico'; // por defecto

  function seleccionarServicio(tipo, multiplicador) {
    servicioSeleccionado = tipo;
    
    // Cambiar estilos visuales de las tarjetas seleccionadas
    document.querySelectorAll('.service-card').forEach(card => {
      card.classList.remove('border-orange-500', 'bg-orange-50/40');
      card.classList.add('border-slate-200/80', 'bg-slate-50');
    });

    const selectedCard = document.querySelector(`[data-service="${tipo}"]`);
    if (selectedCard) {
      selectedCard.classList.remove('border-slate-200/80', 'bg-slate-50');
      selectedCard.classList.add('border-orange-500', 'bg-orange-50/40');
    }
  }
</script>
