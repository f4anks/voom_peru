<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom - Pedir Viaje</title>

  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voom">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      -webkit-user-select: none;
      user-select: none;
    }
    #map { height: calc(100vh - 76px); width: 100%; z-index: 1; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Header Blanco / Gris Claro con Sombra Elegante -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-6 py-4 flex items-center justify-between z-[1001] shadow-xs">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 bg-gradient-to-tr from-orange-500 to-amber-500 rounded-2xl flex items-center justify-center text-white font-black text-base shadow-md shadow-orange-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
      </div>
      <div>
        <span class="text-lg font-black text-slate-900 tracking-tight leading-tight block">Voom</span>
        <span class="text-[10px] text-orange-600 font-extrabold uppercase tracking-wider">Pasajero</span>
      </div>
    </div>

    <div class="flex items-center space-x-4">
      <div class="flex flex-col text-right">
        <span id="user-name" class="text-xs font-black text-slate-800 leading-tight">Cargando...</span>
        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Sesión Activa</span>
      </div>
      <!-- Botón de refresco profundo para aplicar cambios del código fuente -->
      <button onclick="forceAppUpdate()" class="text-xs bg-slate-100 hover:bg-orange-50 text-slate-600 hover:text-orange-600 font-bold px-4 py-2.5 rounded-xl transition-all border border-slate-200 flex items-center space-x-1 active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>Refrescar</span>
      </button>
    </div>
  </header>

  <div class="relative flex-1">
    <div id="map"></div>

    <!-- Panel de Solicitud Flotante -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-white/95 backdrop-blur-xl p-6 rounded-3xl border border-slate-200/80 shadow-[0_15px_40px_-15px_rgba(0,0,0,0.12)] z-[1000]">
      
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
        <h2 class="text-sm font-black text-slate-900 tracking-tight uppercase">¿A dónde vamos hoy?</h2>
        <span class="inline-flex items-center space-x-1.5 text-[10px] bg-orange-50 text-orange-700 font-extrabold px-3 py-1 rounded-full border border-orange-200/60">
          <span class="w-1.5 h-1.5 bg-orange-500 rounded-full animate-ping"></span>
          <span>En tiempo real</span>
        </span>
      </div>
      
      <div class="space-y-3">
        <!-- Input Origen -->
        <div class="relative flex items-center">
          <div class="w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-white shadow-xs absolute left-4 z-10"></div>
          <input type="text" id="origen-txt" readonly value="Detectando tu ubicación..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-4 py-3.5 text-xs font-semibold text-slate-700 focus:outline-none" />
        </div>

        <!-- Input Destino con Sugerencias Autocompletadas -->
        <div class="relative flex items-center">
          <div class="w-3.5 h-3.5 bg-orange-500 rounded-full border-2 border-white shadow-xs absolute left-4 z-10"></div>
          <input type="text" id="destino-txt" placeholder="Ingresa punto de destino o busca..." autocomplete="off" class="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-11 pr-4 py-3.5 text-xs font-bold text-slate-900 focus:outline-none focus:border-orange-500 focus:bg-white focus:ring-4 focus:ring-orange-500/10 transition-all" />
          
          <!-- Contenedor Desplegable de Sugerencias -->
          <div id="sugerencias-destino" class="absolute left-0 right-0 top-full mt-2 bg-white border border-slate-200 rounded-2xl shadow-2xl max-h-52 overflow-y-auto hidden z-[2000] divide-y divide-slate-100"></div>
        </div>

        <!-- Tarjeta de Estimación de Precio y Distancia -->
        <div id="precio-box" class="hidden p-4 bg-emerald-50/80 rounded-2xl border border-emerald-200/80 flex items-center justify-between">
          <div>
            <span class="text-[10px] text-emerald-600 font-black uppercase tracking-widest block">Precio Estimado</span>
            <span id="distancia-texto" class="text-[11px] font-semibold text-slate-500">0.0 km</span>
          </div>
          <div class="text-right">
            <span id="precio-monto" class="text-xl font-black text-emerald-700 leading-none">$0.00</span>
          </div>
        </div>

        <!-- Estatus del Viaje -->
        <div id="estado-viaje-box" class="hidden p-4 bg-orange-50/80 rounded-2xl border border-orange-200/80 text-center">
          <span class="text-[10px] text-orange-600 font-black uppercase tracking-widest block mb-0.5">Estado de la solicitud</span>
          <span id="estado-viaje-texto" class="text-xs font-extrabold text-orange-950">Buscando un conductor cercano...</span>
        </div>

        <button id="btn-solicitar" onclick="solicitarViaje()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black py-4 rounded-2xl transition-all shadow-xl shadow-orange-500/25 text-sm tracking-wide mt-2 active:scale-[0.98]">
          Confirmar Solicitud 🚀
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts JS independientes -->
  <script src="./js/mapa.js"></script>
  <script src="./js/pasajero.js"></script>

  <script>
    // Función para forzar la actualización del código fuente limpiando Service Workers y Caché local
    async function forceAppUpdate() {
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
          }
        } catch (e) {
          console.error("Error al desinstalar Service Worker:", e);
        }
      }
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          for (let key of keys) {
            await caches.delete(key);
          }
        } catch (e) {
          console.error("Error al borrar cachés:", e);
        }
      }
      window.location.reload(true);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => console.error('SW Error:', err));
      });
    }

    // Protecciones de interfaz
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
        (e.ctrlKey && e.key === 'U')
      ) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
