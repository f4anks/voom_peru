<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Voom Perú - Registro de Conductor</title>
  
  <!-- Metadatos PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Voom">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6 relative">

  <div class="w-full max-w-lg bg-white rounded-3xl shadow-[0_15px_40px_-15px_rgba(0,0,0,0.08)] border border-slate-200/80 p-8 relative z-10 space-y-6">
    
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-orange-500 via-orange-600 to-amber-500 text-white rounded-2xl shadow-lg shadow-orange-500/25 mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/>
          <path d="M9 17h6"/>
          <circle cx="17" cy="17" r="2"/>
        </svg>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Registro de Conductor Perú</h1>
      <p class="text-xs font-bold text-orange-600 mt-1 uppercase tracking-wider">Información del vehículo y documentos legales</p>
    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <form id="form-registro-conductor" class="space-y-4">
      
      <!-- Información del Vehículo -->
      <div class="space-y-3">
        <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider">Datos del Vehículo</h3>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Matrícula (Placa)</label>
            <input type="text" id="vehiculo-matricula" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white" placeholder="Ej. ABC-123" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Marca</label>
            <input type="text" id="vehiculo-marca" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white" placeholder="Ej. Toyota" />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Modelo</label>
            <input type="text" id="vehiculo-modelo" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white" placeholder="Ej. Yaris" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Color</label>
            <input type="text" id="vehiculo-color" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white" placeholder="Ej. Blanco" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Año</label>
            <input type="number" id="vehiculo-anio" required min="2000" max="2026" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold text-slate-800 focus:outline-none focus:border-orange-500 focus:bg-white" placeholder="Ej. 2022" />
          </div>
        </div>
      </div>

      <hr class="border-slate-100 my-2">

      <!-- Documentos Legales de Perú y Fotos del Vehículo -->
      <div class="space-y-3 text-xs">
        <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider">Documentos y Fotografías</h3>

        <div>
          <label class="block font-bold text-slate-600 mb-1">Licencia de Conducir (brevete)</label>
          <input type="file" id="foto-licencia" accept="image/*" required class="w-full text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 border border-slate-200 rounded-2xl p-2 bg-slate-50" />
        </div>

        <div>
          <label class="block font-bold text-slate-600 mb-1">SOAT / Tarjeta de Propiedad</label>
          <input type="file" id="foto-soat" accept="image/*" required class="w-full text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 border border-slate-200 rounded-2xl p-2 bg-slate-50" />
        </div>

        <div>
          <label class="block font-bold text-slate-600 mb-1">Foto del Vehículo de Frente (con placa visible)</label>
          <input type="file" id="foto-vehiculo-frente" accept="image/*" required class="w-full text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 border border-slate-200 rounded-2xl p-2 bg-slate-50" />
        </div>

        <div>
          <label class="block font-bold text-slate-600 mb-1">Foto del Vehículo de Lado Completo</label>
          <input type="file" id="foto-vehiculo-lado" accept="image/*" required class="w-full text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100 border border-slate-200 rounded-2xl p-2 bg-slate-50" />
        </div>
      </div>

      <div id="status-message" class="p-3 rounded-2xl text-xs text-center hidden font-bold border"></div>

      <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black py-4 rounded-2xl transition-all shadow-xl shadow-orange-500/25 text-sm tracking-wide active:scale-[0.98]">
        Enviar Documentos para Revisión 🚀
      </button>
    </form>

    <button onclick="window.location.href='selector.html'" class="w-full text-xs font-bold text-slate-400 hover:text-slate-600 transition-colors pt-1 text-center block">
      Regresar al Selector de Modo
    </button>
  </div>

  <script>
    const SUPABASE_URL = 'https://gklquvthucityzgcamao.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-p-YL6bWXAQGTddkmm9_mA_HgKlR_eM';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Compresor automático de imágenes para reducir peso a pocos KBs
    function comprimirImagen(file, maxWidth = 1000, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              resolve(blob);
            }, 'image/jpeg', quality);
          };
        };
      });
    }

    document.getElementById('form-registro-conductor').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById('status-message');
      
      try {
        statusMsg.textContent = "Comprimiendo y subiendo documentos legales...";
        statusMsg.className = "p-3 rounded-2xl text-xs text-center font-bold border bg-slate-50 text-slate-600 border-slate-200";
        statusMsg.classList.remove('hidden');

        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError || !session) {
          window.location.href = 'index.html';
          return;
        }

        const user = session.user;
        const matricula = document.getElementById('vehiculo-matricula').value;
        const marca = document.getElementById('vehiculo-marca').value;
        const modelo = document.getElementById('vehiculo-modelo').value;
        const color = document.getElementById('vehiculo-color').value;
        const anio = document.getElementById('vehiculo-anio').value;

        // Capturar archivos legales de Perú y fotos del vehículo
        const fileLicencia = document.getElementById('foto-licencia').files[0];
        const fileSoat = document.getElementById('foto-soat').files[0];
        const fileFrente = document.getElementById('foto-vehiculo-frente').files[0];
        const fileLado = document.getElementById('foto-vehiculo-lado').files[0];

        // Función para subir al Storage con compresión
        const subirArchivo = async (file, nombreCampo) => {
          if (!file) return null;
          const blobComprimido = await comprimirImagen(file);
          const fileName = `${user.id}/${nombreCampo}_${Date.now()}.jpg`;
          
          const { error } = await supabaseClient.storage
            .from('documentos-conductores')
            .upload(fileName, blobComprimido, { upsert: true });

          if (error) throw error;

          const { data: publicUrlData } = supabaseClient.storage
            .from('documentos-conductores')
            .getPublicUrl(fileName);

          return publicUrlData.publicUrl;
        };

        statusMsg.textContent = "Guardando archivos en Supabase de forma segura...";
        const urlLicencia = await subirArchivo(fileLicencia, 'licencia_peru');
        const urlSoat = await subirArchivo(fileSoat, 'soat_tarjeta');
        const urlFrente = await subirArchivo(fileFrente, 'vehiculo_frente');
        const urlLado = await subirArchivo(fileLado, 'vehiculo_lado');

        // Actualizar tabla perfiles con los nuevos campos detallados y estado pendiente
        const { error: updateError } = await supabaseClient
          .from('perfiles')
          .update({
            vehiculo_placa: matricula,
            vehiculo_marca: marca,
            vehiculo_modelo: modelo,
            vehiculo_color: color,
            vehiculo_anio: anio,
            foto_licencia_url: urlLicencia,
            foto_soat_url: urlSoat,
            foto_vehiculo_frente_url: urlFrente,
            foto_vehiculo_lado_url: urlLado,
            estado_cuenta: 'pendiente'
          })
          .eq('id', user.id);

        if (updateError) throw updateError;

        statusMsg.textContent = "¡Documentos enviados con éxito! Redirigiendo...";
        statusMsg.className = "p-3 rounded-2xl text-xs text-center font-bold border bg-emerald-50 text-emerald-600 border-emerald-200";

        setTimeout(() => {
          window.location.href = 'conductor.html';
        }, 1500);

      } catch (err) {
        console.error("Error al registrar conductor:", err);
        statusMsg.textContent = "Error al enviar los documentos. Verifica tu conexión.";
        statusMsg.className = "p-3 rounded-2xl text-xs text-center font-bold border bg-red-50 text-red-600 border-red-200";
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
