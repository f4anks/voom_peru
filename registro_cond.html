<script>
  const SUPABASE_URL = 'https://gklquvthucityzgcamao.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_-p-YL6bWXAQGTddkmm9_mA_HgKlR_eM';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Compresor de imágenes en navegador
  function comprimirImagen(file, maxWidth = 1000, quality = 0.7) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            resolve(blob);
          }, 'image/jpeg', quality);
        };
      };
    });
  }

  document.getElementById('form-registro-conductor').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusMsg = document.getElementById('status-message');
    
    try {
      statusMsg.textContent = "Comprimiendo y procesando fotos legales...";
      statusMsg.className = "p-3 rounded-2xl text-xs text-center font-bold border bg-slate-50 text-slate-600 border-slate-200";
      statusMsg.classList.remove('hidden');

      const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
      if (sessionError || !session) {
        window.location.href = 'index.html';
        return;
      }

      const user = session.user;
      const tipoServicio = document.getElementById('tipo-servicio').value;
      const matricula = document.getElementById('vehiculo-matricula').value;
      const marca = document.getElementById('vehiculo-marca').value;
      const modelo = document.getElementById('vehiculo-modelo').value;
      const color = document.getElementById('vehiculo-color').value;
      const anio = document.getElementById('vehiculo-anio').value;

      // Archivos
      const fileLicencia = document.getElementById('foto-licencia').files[0];
      const fileSoat = document.getElementById('foto-soat').files[0];
      const fileFrente = document.getElementById('foto-vehiculo-frente').files[0];
      const fileLado = document.getElementById('foto-vehiculo-lado').files[0];

      // Subida al Storage
      const subirArchivo = async (file, nombreCampo) => {
        if (!file) return null;
        const blobComprimido = await comprimirImagen(file);
        const fileName = `${user.id}/${nombreCampo}_${Date.now()}.jpg`;
        
        const { error } = await supabaseClient.storage
          .from('documentos-conductores')
          .upload(fileName, blobComprimido, { upsert: true });

        if (error) throw error;

        const { data: publicUrlData } = supabaseClient.storage
          .from('documentos-conductores')
          .getPublicUrl(fileName);

        return publicUrlData.publicUrl;
      };

      statusMsg.textContent = "Subiendo fotos al servidor seguro...";
      const urlLicencia = await subirArchivo(fileLicencia, 'licencia_peru');
      const urlSoat = await subirArchivo(fileSoat, 'soat_tarjeta');
      const urlFrente = await subirArchivo(fileFrente, 'vehiculo_frente');
      const urlLado = await subirArchivo(fileLado, 'vehiculo_lado');

      // Actualizar perfiles guardando tipo_servicio
      const { error: updateError } = await supabaseClient
        .from('perfiles')
        .update({
          tipo_servicio: tipoServicio,
          vehiculo_placa: matricula,
          vehiculo_marca: marca,
          vehiculo_modelo: modelo,
          vehiculo_color: color,
          vehiculo_anio: anio,
          foto_licencia_url: urlLicencia,
          foto_soat_url: urlSoat,
          foto_vehiculo_frente_url: urlFrente,
          foto_vehiculo_lado_url: urlLado,
          estado_cuenta: 'pendiente'
        })
        .eq('id', user.id);

      if (updateError) throw updateError;

      // MOSTRAR PANTALLA DE REVISIÓN ADMINISTRATIVA TRAS ENVÍO EXITOSO
      mostrarPantallaEspera();

    } catch (err) {
      console.error("Error al registrar conductor:", err);
      const detalleError = err.message || err.error_description || JSON.stringify(err);
      statusMsg.textContent = "Error al enviar los datos: " + detalleError;
      statusMsg.className = "p-3 rounded-2xl text-xs text-center font-bold border bg-red-50 text-red-600 border-red-200";
    }
  });

  // Función para renderizar la pantalla de confirmación/espera
  function mostrarPantallaEspera() {
    const contenedor = document.querySelector('body > div');
    if (!contenedor) return;

    contenedor.innerHTML = `
      <div class="text-center space-y-5">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-orange-100 text-orange-600 rounded-3xl shadow-xs animate-pulse">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>

        <div class="space-y-2">
          <h2 class="text-xl font-black text-slate-900 tracking-tight">¡Documentos Enviados!</h2>
          <div class="p-4 rounded-2xl bg-orange-50 border border-orange-200 text-left">
            <p class="text-xs font-bold text-orange-900 text-center uppercase tracking-wider">Estado de la solicitud</p>
            <p class="text-xs text-slate-700 mt-1.5 text-center leading-relaxed">
              Tu estado actual es en <strong>Espera por revisión del departamento administrativo Voom</strong>.
            </p>
          </div>
        </div>

        <p class="text-xs text-slate-500 leading-relaxed px-2">
          Verificaremos la autenticidad de tus documentos legales en breve. Recibirás acceso completo al panel de conducción una vez tu cuenta sea aprobada.
        </p>

        <div class="pt-2 space-y-3">
          <button onclick="window.location.href='selector.html'" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black py-4 rounded-2xl transition-all shadow-xl shadow-orange-500/25 text-sm tracking-wide active:scale-[0.98]">
            Volver al Selector de Modo 🚀
          </button>
          
          <button onclick="window.location.href='conductor.html'" class="w-full text-xs font-bold text-slate-500 hover:text-slate-800 transition-colors py-2 block text-center">
            Verificar Estado de Mi Cuenta
          </button>
        </div>
      </div>
    `;
  }

  document.addEventListener('contextmenu', e => e.preventDefault());
</script>
